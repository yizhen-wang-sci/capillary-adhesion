# Rough over rough surface configuration

# Sweep over different contact angles

[[batch]]
path="capillary.contact_angle_degree"
values=[5, 60, 75, 90, 105, 120, 175]

[grid]
lateral_size = 1.0
nb_pixels = 1024

[surface.upper]
shape = "rough"

[surface.upper.rough]
length_unit = "pixel"
rolloff_wavelength = 64
cutoff_wavelength = 8
hurst_exponent = 0.8
prefactor = 1e1
seed = 0

[surface.lower]
shape = "rough"

[surface.lower.rough]
length_unit = "pixel"
rolloff_wavelength = 64
cutoff_wavelength = 8
hurst_exponent = 0.8
prefactor = 1e1
seed = 1

[capillary]
length_unit = "pixel"
interface_thickness = 2
contact_angle_degree = 90
perimeter_weight = 1e-3

[trajectory]
length_unit = "lateral"
max_separation = 1.5
min_separation = 0.5
nb_decrements = 100
round_trip = true
nb_cycles = 10

[constraint]
liquid_volume_percent = 50.0

[optimizer]
max_nb_iters = 5000
tol_gradient = 1e-8
tol_step = 1e-8
