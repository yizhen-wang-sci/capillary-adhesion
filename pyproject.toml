[build-system]
requires = ["flit_core>=3.2"]
build-backend = "flit_core.buildapi"

[project]
name = "a_package"
description = "Python skeleton project"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [
    { name = "Yizhen Wang", email = "yizhen.wang@imtek.uni-freiburg.de" },
    { name = "Lars Pastewka", email = "lars.pastewka@imtek.uni-freiburg.de" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python"
]
requires-python = ">=3.10.0"
dynamic = [ "version" ]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "tomli-w",
    # backports
    "tomli; python_version < '3.11'",
    "backports.strenum; python_version < '3.11'"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov"
]
lint = [
    # Pinning the version to guarantee identical linting results across all environments.
    "ruff==0.16.1"
]

[project.urls]
documentation = "https://imtek-simulation.github.io/python-skeleton/"
repository = "https://github.com/imtek-simulation/python-skeleton"
changelog = "https://github.com/imtek-simulation/python-skeleton/blob/master/CHANGELOG.md"

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[tool.coverage.run]
source = ["a_package"]
branch = true

[tool.coverage.report]
fail_under = 70
exclude_also = [
    # Backward compatibility mechanism
    "if sys.version_info",
    # Entry points
    "if __name__ == .__main__.:",
    # Defensive assertion code
    "raise AssertionError",
    "raise NotImplementedError",
    # Debug-only code
    "def __repr__",
    "if self\\.debug",
    # Abstract methods or typing protocols
    "@(abc\\.)?abstractmethod",
    "class .*\\bProtocol\\):",
    "\\.\\.\\."
]

[tool.ruff]
src = [".", "example/*"]
line-length = 120

[tool.ruff.lint]
# Added on top of the default rule set:
# E501: code line length
# W505: doc line length
# D: doc string presence and layout
# NPY: legacy NumPy random, and NumPy 2 deprecations
extend-select = ["E501", "W505", "D", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["a_package"]

[tool.ruff.lint.per-file-ignores]
# Unused imports
"a_package/**/__init__.py" = ["F401"]
# Docstrings
"test/**" = ["D"]
# Skip totally
"example/**" = ["ALL"]
"maintenance/**" = ["ALL"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"
